site_name: Pekka Pirilän tulospalveluohjelmat
site_description: Vanhojen tulospalveluohjelmien (HkKisaWin, ViestiWin, HkMaali)
  käyttöohjeet, tuotu alkuperäisiltä sivuilta markdown-muotoon.
site_url: https://pirilatp.github.io/tulospalvelu/
repo_url: https://github.com/PirilaTP/tulospalvelu
repo_name: PirilaTP/tulospalvelu
edit_uri: edit/main/docs-site/docs/

theme:
  name: material
  language: fi
  features:
    # navigation.instant left out: incompatible with the i18n plugin's
    # contextual language switcher (same page in the other language)
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Vaihda tummaan teemaan
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Vaihda vaaleaan teemaan
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PirilaTP/tulospalvelu

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fi
          name: Suomi
          build: true
          default: true
        - locale: sv
          name: Svenska
          build: true
          site_name: "Pekka Piriläs resultatprogram"
          site_description: "Bruksanvisningar för Pekka Piriläs resultatprogram (HkKisaWin, ViestiWin, HkMaali)."
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/brightness-7
                  name: "Byt till mörkt tema"
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/brightness-4
                  name: "Byt till ljust tema"
