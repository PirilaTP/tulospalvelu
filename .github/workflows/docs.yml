name: Docs

# Documentation site only: never builds or releases the timekeeping programs.
# - pull requests and pushes that touch the documentation: validate the knowledge base,
#   build the site, check links, source links and the portal (no deployment);
# - deployment to GitHub Pages only by a manual run ("Run workflow") on main with
#   "julkaise" checked, through the github-pages environment, and only when owner decision
#   OP-1 (publication of the audit material) is recorded as decided (julkaisulupa.py).

on:
  pull_request:
    paths:
      - "docs-site/**"
      - "doc/**"
      - "TPsource/**"
      - ".claude/agents/**"
      - ".claude/skills/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "doc/**"
      - "TPsource/**"
      - ".claude/agents/**"
      - ".claude/skills/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      julkaise:
        description: "Julkaise sivusto GitHub Pagesiin (vain main-haarasta)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}-${{ github.event_name }}
  # superseded pull request builds are cancelled; runs on main (and a deployment) never are
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # source links are resolved and checked against the audit revisions
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.lock
      - name: Install MkDocs
        run: pip install -r docs-site/requirements.lock
      - name: Repository paths fit Windows MAX_PATH on the self-hosted runner
        # the GUI build job extracts the repository under a ~120-character directory;
        # a longer repository path makes actions/checkout fail there
        run: |
          long=$(git ls-files | awk 'length($0) > 135')
          if [ -n "$long" ]; then echo "paths longer than 135 characters:"; echo "$long"; exit 1; fi
      - name: Validate the canonical knowledge base
        run: |
          python -I doc/arkkitehtuuri/tyokalut/tarkista_auditointi.py .
          python -I doc/arkkitehtuuri/tyokalut/synteesi.py . "$RUNNER_TEMP/synteesi" --tarkista
          python -I doc/arkkitehtuuri/tyokalut/viitteet.py .
          python -I doc/arkkitehtuuri/tyokalut/tietopohja.py . tarkista
          python -I doc/arkkitehtuuri/tyokalut/sivusto.py . --tarkista
      - name: Build the site (pages, portal and coverage are generated from doc/)
        run: mkdocs build --strict --site-dir ../site
        working-directory: docs-site
        env:
          NO_MKDOCS_2_WARNING: "1"
      - name: Check links, source links, old addresses and the portal
        run: |
          python -I docs-site/scripts/tarkista_sivusto.py site --osoitteet docs-site/scripts/osoitteet.txt
          node doc/arkkitehtuuri/tyokalut/portaali_testi.js site/laatu/portaali/app
      - name: Local portal (doc/tietopohja/portaali) still builds and works
        run: |
          python -I doc/arkkitehtuuri/tyokalut/portaali.py .
          python -I doc/arkkitehtuuri/tyokalut/portaali.py . --tarkista
          node doc/arkkitehtuuri/tyokalut/portaali_testi.js
      - name: Publication gate (owner decision OP-1 must be recorded as decided)
        if: github.event_name == 'workflow_dispatch' && inputs.julkaise
        run: python -I docs-site/scripts/julkaisulupa.py .
      - name: Keep the built site for review
        if: github.event_name != 'workflow_dispatch' || !inputs.julkaise
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          retention-days: 7
      - name: Package for GitHub Pages
        if: github.event_name == 'workflow_dispatch' && inputs.julkaise && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.julkaise && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
