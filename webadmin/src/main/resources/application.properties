server.port=${PORT:8080}
# Keep REST error bodies clean: a short message, never an internal stack trace.
server.error.include-stacktrace=never
server.error.include-message=always
logging.level.org.atmosphere = warn
logging.file.name=webadmin.log
# Tulospalvelu data directory (contains KILP.DAT and laskenta.cfg)
# Shown as default in setup screen. Relative to working directory.
#tulospalvelu.data-dir=../kisat/J1Data/

# Skip setup screen and start automatically with data-dir above.
#tulospalvelu.auto-start=true

# REST API key (guards endpoints under /api/**). When unset, the API is
# disabled and rejects all requests. Can also be supplied as the
# TULOSPALVELU_API_KEY environment variable or --tulospalvelu.api.key=... arg.
#tulospalvelu.api.key=change-me