name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Nopea palaute: kaantaa vain testattavat, riippuvuuksista irrotetut
  # kaannosyksikot g++:lla. Hajoaa heti, jos niihin lisataan Windows- tai
  # globaaliriippuvuus, eli pitaa testattavuuden ylla.
  unit-tests-gcc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests (g++)
        working-directory: TPsource/V52
        run: ./Tests/run.sh

  # Samat testit silla kaantajalla ja wchar_t-leveydella, jolla ohjelma ajetaan.
  unit-tests-msvc:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build unit tests
        run: msbuild TPsource\V52\VS\Tests\TpTest.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143

      - name: Run unit tests
        run: TPsource\V52\VS\Tests\Release\TpTest.exe

  console:
    name: Console programs (MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build utility libraries (tputilv2 + dbboxm)
        run: msbuild TPsource\V52\VS\Libs\tputilv2.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143

      - name: Build HkMaali (individual competition)
        run: msbuild TPsource\V52\VS\Hk\HkMaali520.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143

      - name: Build JukMaali (relay competition)
        run: msbuild TPsource\V52\VS\V\JukMaali520.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143

  gui:
    name: Windows GUI programs (C++Builder, self-hosted)
    # Self-hosted runner "TPbuilderi" with C++Builder Community Edition installed
    # in C:\Program Files (x86)\Embarcadero\Studio\37.0.
    runs-on: [self-hosted, Windows, X64]
    # Never run code from forked pull requests on the self-hosted machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 90
    concurrency:
      group: cbuilder-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Build DBboxm, Tputil, HkKisaWin and ViestiWin
        # Explicit shell command so the machine's PowerShell execution policy
        # (Restricted by default) does not block the runner's generated script.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: .\TPsource\V52\RADStudio10\build-gui.ps1

      - name: Upload GUI binaries
        uses: actions/upload-artifact@v7
        with:
          name: windows-gui-win32
          path: |
            TPexe/Hk/V521/HkKisaWin.exe
            TPexe/Juk/V521/ViestiWin.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cbuilder-build-logs
          path: TPsource/V52/RADStudio10/build-logs/
          if-no-files-found: ignore
          retention-days: 7
